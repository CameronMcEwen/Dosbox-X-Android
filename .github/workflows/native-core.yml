name: Rebuild DOSBox-X native core

# Pulls the latest stable upstream DOSBox-X release, applies our patches, and
# cross-builds libmain.so for each ABI. A clean CI runner is the ideal place for
# this: unlike a dev box, it has no host SDL2/alsa/curses to contaminate the
# autotools probes. If upstream has moved under a patch, or a new Android
# incompatibility appears, the job FAILS — that is the "flag the issue" signal.
#
# Triggers: manual, or weekly to catch upstream drift early. It does not commit;
# it uploads the rebuilt libmain.so as artifacts for review. Download, drop into
# app/src/main/jniLibs/<abi>/, test, and commit (with the submodule ref + any
# refreshed patches).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Upstream ref to build (blank = latest stable tag)"
        required: false
        default: ""
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  build:
    name: Cross-build libmain.so
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    steps:
      - name: Check out repository (with submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y autoconf automake nasm

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Build native core (${{ matrix.abi }})
        env:
          ANDROID_NDK: ${{ steps.ndk.outputs.ndk-path }}
          DBX_ABIS: ${{ matrix.abi }}
          DBX_REF: ${{ github.event.inputs.ref }}
        run: ./native/build-android.sh

      - name: Report the upstream ref that was built
        run: git -C native/dosbox-x describe --tags --always

      - name: Upload rebuilt libmain.so
        uses: actions/upload-artifact@v4
        with:
          name: libmain-${{ matrix.abi }}
          path: app/src/main/jniLibs/${{ matrix.abi }}/libmain.so
          if-no-files-found: error
